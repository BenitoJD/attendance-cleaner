name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tools/AttendanceCleaner.Tests

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      # folder build (RECOMMENDED): classic layout with every runtime DLL beside the exe
      - name: Publish win-x64 (folder)
        run: >
          dotnet publish src/AttendanceCleaner
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -r win-x64
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -o publish-x64

      - name: Publish win-x86 (folder)
        run: >
          dotnet publish src/AttendanceCleaner
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -r win-x86
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -o publish-x86

      # single-file build (experimental): one exe; kept as a bonus, not the primary download
      - name: Publish win-x64 (single file, experimental)
        run: >
          dotnet publish src/AttendanceCleaner
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -r win-x64
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -o publish-sf-x64

      - name: Verify the folder build is complete
        shell: pwsh
        run: |
          $runtime = Get-ChildItem 'publish-x64' -Filter 'Microsoft.WindowsAppRuntime*.dll' -ErrorAction SilentlyContinue
          $exe = Get-Item 'publish-x64/AttendanceCleaner.exe'
          Write-Host "x64 folder: $((Get-ChildItem 'publish-x64').Count) files, exe is $([math]::Round($exe.Length/1KB)) KB, WinAppSDK runtime DLLs: $($runtime.Count)"
          if ($runtime.Count -eq 0) { throw 'Folder build is missing the Windows App SDK runtime DLLs - it would not start on a clean PC.' }
          if ($exe.Length -gt 10MB) { throw 'Folder build exe is unexpectedly large - the single-file output leaked into it.' }

      - name: Zip the folder builds
        shell: pwsh
        run: |
          Compress-Archive -Path 'publish-x64/*' -DestinationPath 'AttendanceCleaner-win-x64.zip'
          Compress-Archive -Path 'publish-x86/*' -DestinationPath 'AttendanceCleaner-win-x86.zip'
          Copy-Item 'publish-sf-x64/AttendanceCleaner.exe' 'AttendanceCleaner-x64.exe'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.version }}" }
          $notes = @"
          Attendance Cleaner $tag

          RECOMMENDED - the zip builds (classic layout, run anywhere):
          1. Download AttendanceCleaner-win-x64.zip (64-bit) or AttendanceCleaner-win-x86.zip (32-bit)
          2. Right-click the zip, Extract All
          3. Open the folder and double-click AttendanceCleaner.exe
          First launch: if Windows shows a blue SmartScreen warning, click More info, then Run anyway.

          BONUS - AttendanceCleaner-x64.exe is a single-file build. Try it if you prefer one file; if it does not start, use the zip above.
          "@
          gh release create $tag --title $tag --notes $notes --latest AttendanceCleaner-win-x64.zip AttendanceCleaner-win-x86.zip AttendanceCleaner-x64.exe
