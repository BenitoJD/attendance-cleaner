name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tools/AttendanceCleaner.Tests

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Publish Windows exe (self-contained win-x64)
        run: >
          dotnet publish src/AttendanceCleaner
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -r win-x64
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true

      - name: Publish Windows exe (self-contained win-x86, 32-bit)
        run: >
          dotnet publish src/AttendanceCleaner
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -r win-x86
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true

      # the headline artifact: ONE exe with everything bundled inside
      - name: Publish single-file exe (win-x64)
        run: >
          dotnet publish src/AttendanceCleaner
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -r win-x64
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Rename and stage release files
        shell: pwsh
        run: |
          $sf = 'src/AttendanceCleaner/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/AttendanceCleaner.exe'
          $sfSize = (Get-Item $sf).Length
          Write-Host "single-file exe size: $([math]::Round($sfSize/1MB,1)) MB"
          Copy-Item $sf 'AttendanceCleaner.exe'
          Compress-Archive -Path 'src/AttendanceCleaner/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/*' -DestinationPath 'AttendanceCleaner-win-x64.zip'
          Compress-Archive -Path 'src/AttendanceCleaner/bin/Release/net10.0-windows10.0.19041.0/win-x86/publish/*' -DestinationPath 'AttendanceCleaner-win-x86.zip'

      - name: Create GitHub release with both installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.version }}" }
          $notes = @"
          Attendance Cleaner $tag

          - AttendanceCleaner.exe — THE ONE TO USE: a single file, everything bundled. Download and double-click, that's all.
          - AttendanceCleaner-win-x64.zip — same app as a folder of files (fallback if the single exe is blocked on very locked-down PCs)
          - AttendanceCleaner-win-x86.zip — 32-bit Windows fallback
          "@
          gh release create $tag --title $tag --notes $notes --latest AttendanceCleaner.exe AttendanceCleaner-win-x64.zip AttendanceCleaner-win-x86.zip
