name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tools/AttendanceCleaner.Tests

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # code signing via Azure Trusted Signing. Set these repo secrets and every
      # release is signed automatically (no SmartScreen / Smart App Control blocks):
      # AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      # AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SIGNING_CONFIGURED: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests on Windows
        run: dotnet test tools/AttendanceCleaner.Tests --configuration Release -warnaserror

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Install NSIS
        run: choco install nsis --version=3.13 --yes --no-progress

      # folder build (RECOMMENDED): classic layout with every runtime DLL beside the exe
      - name: Publish win-x64 (folder)
        run: >
          dotnet publish src/AttendanceCleaner
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -r win-x64
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -o publish-x64

      - name: Publish win-x86 (folder)
        run: >
          dotnet publish src/AttendanceCleaner
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -r win-x86
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -o publish-x86

      # signing activates only when the Azure Trusted Signing secrets are configured
      - name: Sign folder exe x64
        if: ${{ env.AZURE_SIGNING_CONFIGURED != 'false' && env.AZURE_SIGNING_CONFIGURED != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          code-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: publish-x64
          files-folder-filter: AttendanceReportStudio.exe
          file-digest: sha256
          timestamp-digest: sha256
          timestamp-server: http://timestamp.acs.microsoft.com

      - name: Sign folder exe x86
        if: ${{ env.AZURE_SIGNING_CONFIGURED != 'false' && env.AZURE_SIGNING_CONFIGURED != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          code-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: publish-x86
          files-folder-filter: AttendanceReportStudio.exe
          file-digest: sha256
          timestamp-digest: sha256
          timestamp-server: http://timestamp.acs.microsoft.com

      - name: Build setup installers
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.version }}" }
          $version = $tag.TrimStart('v')
          pwsh -File tools/installer/Build-Installers.ps1 -AppVersion $version

      - name: Sign setup installer x64
        if: ${{ env.AZURE_SIGNING_CONFIGURED != 'false' && env.AZURE_SIGNING_CONFIGURED != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          code-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: build-artifacts
          files-folder-filter: AttendanceReportStudio-Setup-x64.exe
          file-digest: sha256
          timestamp-digest: sha256
          timestamp-server: http://timestamp.acs.microsoft.com

      - name: Sign setup installer x86
        if: ${{ env.AZURE_SIGNING_CONFIGURED != 'false' && env.AZURE_SIGNING_CONFIGURED != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          code-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: build-artifacts
          files-folder-filter: AttendanceReportStudio-Setup-x86.exe
          file-digest: sha256
          timestamp-digest: sha256
          timestamp-server: http://timestamp.acs.microsoft.com

      - name: Verify the folder build is complete
        shell: pwsh
        run: |
          $runtime = Get-ChildItem 'publish-x64' -Filter 'Microsoft.WindowsAppRuntime*.dll' -ErrorAction SilentlyContinue
          $exe = Get-Item 'publish-x64/AttendanceReportStudio.exe'
          Write-Host "x64 folder: $((Get-ChildItem 'publish-x64').Count) files, exe is $([math]::Round($exe.Length/1KB)) KB, WinAppSDK runtime DLLs: $($runtime.Count)"
          if ($runtime.Count -eq 0) { throw 'Folder build is missing the Windows App SDK runtime DLLs - it would not start on a clean PC.' }
          if ($exe.Length -gt 10MB) { throw 'Folder build exe is unexpectedly large - the single-file output leaked into it.' }

      - name: Launch test folder build x64
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'publish-x64/AttendanceReportStudio.exe' -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { break }
            if ($p.MainWindowHandle -ne 0) { $ok = $true; break }
          }
          Write-Host "x64 folder build: started=$ok window=$($p.MainWindowHandle)"
          if (-not $ok) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'x64 folder build failed to start on a clean Windows machine' }
          Stop-Process -Id $p.Id -Force

      - name: Launch test folder build x86
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'publish-x86/AttendanceReportStudio.exe' -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { break }
            if ($p.MainWindowHandle -ne 0) { $ok = $true; break }
          }
          Write-Host "x86 folder build: started=$ok window=$($p.MainWindowHandle)"
          if (-not $ok) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'x86 folder build failed to start on a clean Windows machine' }
          Stop-Process -Id $p.Id -Force

      - name: Zip the folder builds
        shell: pwsh
        run: |
          Compress-Archive -Path 'publish-x64/*' -DestinationPath 'AttendanceReportStudio-win-x64.zip'
          Compress-Archive -Path 'publish-x86/*' -DestinationPath 'AttendanceReportStudio-win-x86.zip'

      - name: Test setup install, launch, and uninstall
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.version }}" }
          $version = $tag.TrimStart('v')
          pwsh -File tools/installer/Test-Installers.ps1 -AppVersion $version

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.version }}" }
          $notes = @"
          Attendance Report Studio $tag

          Recommended: download the setup EXE for your Windows architecture and run it. It installs Attendance Report Studio for the current Windows user, creates a Start menu shortcut, and adds an uninstaller. No separate .NET installation is required.
          ZIP files remain available as portable copies; extract the complete folder and run AttendanceReportStudio.exe from inside it.
          - AttendanceReportStudio-Setup-x64.exe - recommended for 64-bit Windows 10/11
          - AttendanceReportStudio-Setup-x86.exe - 32-bit Windows installer
          - AttendanceReportStudio-win-x64.zip - 64-bit Windows 10/11 (almost every modern PC)
          - AttendanceReportStudio-win-x86.zip - 32-bit Windows (also runs on 64-bit Windows if unsure which to pick)
          "@
          gh release create $tag --title $tag --notes $notes --latest build-artifacts/AttendanceReportStudio-Setup-x64.exe build-artifacts/AttendanceReportStudio-Setup-x86.exe AttendanceReportStudio-win-x64.zip AttendanceReportStudio-win-x86.zip
