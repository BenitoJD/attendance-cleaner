name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/windows-build.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tools/AttendanceCleaner.Tests

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Publish Windows exe (self-contained win-x64)
        run: >
          dotnet publish src/AttendanceCleaner
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -r win-x64
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true

      - name: Zip win-x64 publish output
        run: Compress-Archive -Path 'src/AttendanceCleaner/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/*' -DestinationPath 'AttendanceCleaner-win-x64.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: AttendanceCleaner-win-x64
          path: AttendanceCleaner-win-x64.zip

      # 32-bit (x86) Windows machines get their own self-contained build
      - name: Publish Windows exe (self-contained win-x86, 32-bit)
        run: >
          dotnet publish src/AttendanceCleaner
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          -r win-x86
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true

      - name: Zip win-x86 publish output
        run: Compress-Archive -Path 'src/AttendanceCleaner/bin/Release/net10.0-windows10.0.19041.0/win-x86/publish/*' -DestinationPath 'AttendanceCleaner-win-x86.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: AttendanceCleaner-win-x86
          path: AttendanceCleaner-win-x86.zip
